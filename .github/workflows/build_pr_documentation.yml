name: Build PR Documentation

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned before the doc-builder light install (huggingface/doc-builder#801), which skips the real dependencies of setfit
    uses: huggingface/doc-builder/.github/workflows/build_pr_documentation.yml@9f9bb430a712b5650d0e43e510656098ecdd75d4  # main
    with:
      commit_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.number }}
      package: setfit
      languages: en