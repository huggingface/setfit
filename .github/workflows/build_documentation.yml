name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    # Pinned before the doc-builder light install (huggingface/doc-builder#801), which skips the real dependencies of setfit
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@61704e23fa97c0502ce5355c489c6bec4194bff1  # main
    with:
      commit_sha: ${{ github.sha }}
      package: setfit
      notebook_folder: setfit_doc
      languages: en
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}