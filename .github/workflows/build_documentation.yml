name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    # Pinned before the doc-builder light install (huggingface/doc-builder#801), which skips the real dependencies of setfit
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@9f9bb430a712b5650d0e43e510656098ecdd75d4  # main
    with:
      commit_sha: ${{ github.sha }}
      package: setfit
      notebook_folder: setfit_doc
      languages: en
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}