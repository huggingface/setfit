[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setfit"
version = "1.2.0.dev0"
description = "Efficient few-shot learning with Sentence Transformers"
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.9"
maintainers = [
    { name = "Lewis Tunstall", email = "lewis@huggingface.co" },
    { name = "Tom Aarsen" },
]
keywords = ["nlp", "machine learning", "fewshot learning", "transformers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=2.15.0",
    "sentence-transformers[train]>=3",
    "transformers>=4.41.0",
    "evaluate>=0.3.0",
    "huggingface_hub>=0.24.0",
    "scikit-learn",
    "packaging",
]

[project.optional-dependencies]
optuna     = ["optuna"]
quality    = ["black", "flake8", "flake8-pyproject", "isort", "tabulate"]
onnx       = ["onnxruntime", "onnx>=1.17.0", "skl2onnx"]
openvino   = ["onnxruntime", "onnx>=1.17.0", "skl2onnx", "hummingbird-ml", "openvino"]
docs       = ["hf-doc-builder>=0.3.0"]
codecarbon = ["codecarbon<2.6.0"]
tests      = [
    "pytest", "pytest-cov",
    "onnxruntime", "onnx>=1.17.0", "skl2onnx",
    "hummingbird-ml", "openvino",
]
dev = [
    "optuna",
    "black", "flake8", "flake8-pyproject", "isort", "tabulate",
    "pytest", "pytest-cov",
    "onnxruntime", "onnx>=1.17.0", "skl2onnx",
    "hummingbird-ml", "openvino",
    "hf-doc-builder>=0.3.0",
    "codecarbon<2.6.0",
]

[project.urls]
Homepage = "https://github.com/huggingface/setfit"
Download = "https://github.com/huggingface/setfit/tags"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 119
lines_after_imports = 2

[tool.flake8]
ignore = ["E203", "E501", "W503"]
max-line-length = 119
per-file-ignores = [
    "__init__.py: F401",
]
exclude = [
    "results",
    "scripts/adapet",
    "scripts/tfew",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=setfit --durations=10"
